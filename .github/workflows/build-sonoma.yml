name: Build Glance for Sonoma Intel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'glance/**'
      - 'glance.xcodeproj/**'
      - 'support/**'
      - 'tools/liveness_selftest.swift'
      - '.github/workflows/build-sonoma.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and inspect the Intel app
        run: bash support/build-sonoma.sh
      - name: Run liveness regression checks
        run: |
          xcrun swiftc -O -warnings-as-errors -o "$RUNNER_TEMP/liveness_selftest" \
            glance/Liveness/LandmarkGeometry.swift \
            glance/Liveness/LivenessScoring.swift \
            glance/Liveness/GeometryLiveness.swift \
            glance/Liveness/GlareCue.swift \
            glance/Liveness/LivenessCues.swift \
            glance/Liveness/LivenessAnalyzer.swift \
            tools/liveness_selftest.swift
          "$RUNNER_TEMP/liveness_selftest"
      - name: Upload the DMG and package verification
        uses: actions/upload-artifact@v4
        with:
          name: Glance-Sonoma-Intel-macOS14.8.9
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Keep build logs for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Glance-Sonoma-build-logs
          path: |
            build/sonoma/run.*/build.log
            build/sonoma/run.*/toolchain.txt
          if-no-files-found: ignore
          retention-days: 14
